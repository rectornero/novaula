<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vota · Novaula</title>
<meta name="theme-color" content="#141c30">
<style>
  @font-face{font-family:"Bricolage Grotesque";font-weight:200 800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-wght-normal.woff2) format("woff2")}
  :root{--ink:#eef1f8;--muted:#a9b3cc;--bg:#141c30;--card:#1e2842;--acc:#2f6fde;--ok:#127048;--ok-soft:#7fe0b0;--bad:#f0857a;--hl:#ffe45c}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
  main{max-width:560px;margin:0 auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-family:"Bricolage Grotesque",system-ui;font-weight:750;font-size:22px;color:#fff;text-decoration:none}
  .cls{font-weight:700;background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}
  h1{font-family:"Bricolage Grotesque",system-ui;font-size:26px;line-height:1.2;margin:4px 0 0}
  .kind{align-self:flex-start;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:4px 12px;border-radius:999px;background:var(--hl);color:#2b2400}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{appearance:none;display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid rgba(255,255,255,.12);background:var(--card);color:var(--ink);border-radius:16px;padding:14px 16px;font:inherit;font-size:18px;cursor:pointer;min-height:64px}
  .opt b{flex:none;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-family:"Bricolage Grotesque",system-ui;font-size:22px}
  .opt:disabled{cursor:default}
  .opt.mine{border-color:var(--acc);background:#22305a}
  .opt.mine b{background:var(--acc)}
  .opt.right{border-color:var(--ok-soft)}
  .opt.right b{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);opacity:.8}
  .msg{margin:0;color:var(--muted);text-align:center;min-height:1.4em}
  .msg.ok{color:var(--ok-soft);font-weight:700}
  .msg.bad{color:var(--bad);font-weight:700}
  .wait{text-align:center;padding:48px 8px;color:var(--muted)}
  .wait .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--acc);margin:0 3px;animation:b 1.2s infinite}
  .wait .dot:nth-child(2){animation-delay:.2s}.wait .dot:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
  select{font:inherit;padding:12px;border-radius:12px;width:100%}
</style>
</head>
<body>
<main>
  <header><a class="brand" href="./">Novaula</a><span class="cls" id="cls"></span></header>
  <div id="box"><p class="wait"><span class="dot"></span><span class="dot"></span><span class="dot"></span><br>Collegamento…</p></div>
</main>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
(function () {
  "use strict";
  var L = "ABCDEFGHIJ", box = document.getElementById("box");
  var q = new URLSearchParams(location.search), c = (q.get("c") || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  var cfg = window.PIATTAFORMA_CONFIG || {};
  function el(t, a, kids) { var e = document.createElement(t); for (var k in a || {}) { if (k === "text") e.textContent = a[k]; else if (k === "class") e.className = a[k]; else e.setAttribute(k, a[k]); } (kids || []).forEach(function (x) { e.appendChild(typeof x === "string" ? document.createTextNode(x) : x); }); return e; }
  function wait(text) { box.innerHTML = ""; box.appendChild(el("p", { class: "wait" }, [el("span", { class: "dot" }), el("span", { class: "dot" }), el("span", { class: "dot" }), el("br"), text])); }
  if (!cfg.SUPABASE_URL) { wait("Il voto funziona sul sito pubblicato."); return; }
  var sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  var voter;
  try { voter = localStorage.getItem("novaula-votante"); if (!voter) { voter = crypto.randomUUID ? crypto.randomUUID() : ("10000000-1000-4000-8000-100000000000").replace(/[018]/g, function (x) { return (x ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> x / 4).toString(16); }); localStorage.setItem("novaula-votante", voter); } } catch (e) { voter = crypto.randomUUID(); }

  if (!c) {
    sb.from("classes").select("id,name").order("sort").then(function (r) {
      box.innerHTML = "";
      box.appendChild(el("h1", { text: "Di che classe sei?" }));
      var s = el("select", {}, [el("option", { value: "", text: "Scegli…" })].concat((r.data || []).map(function (x) { return el("option", { value: x.id, text: x.name }); })));
      s.onchange = function () { if (s.value) location.search = "?c=" + s.value; };
      box.appendChild(s);
    });
    return;
  }
  document.getElementById("cls").textContent = "Classe " + c.toUpperCase();
  var shown = null, mine = null;
  function key(p) { return p ? p.round + "|" + p.revealed : ""; }
  function render(p) {
    if (key(p) === shown) return;
    if (!p || !p.round) { shown = ""; wait("Aspetta la prossima domanda del docente."); return; }
    var sameRound = shown && shown.split("|")[0] === p.round;
    shown = key(p);
    if (!sameRound) { try { mine = JSON.parse(localStorage.getItem("novaula-voto-" + p.round)); } catch (e) { mine = null; } }
    box.innerHTML = "";
    var wrap = el("div", { style: "display:flex;flex-direction:column;gap:14px" });
    wrap.appendChild(el("span", { class: "kind", text: p.answer != null ? "Quiz" : "Sondaggio" }));
    wrap.appendChild(el("h1", { text: p.question || "Scegli una risposta" }));
    var opts = el("div", { class: "opts" }), msg = el("p", { class: "msg", role: "status" });
    (p.options || []).forEach(function (o, i) {
      var b = el("button", { type: "button", class: "opt" }, [el("b", { text: L[i] }), el("span", { text: o })]);
      if (mine === i) b.classList.add("mine");
      if (p.revealed && p.answer != null) { if (i === p.answer) b.classList.add("right"); else if (mine === i) b.classList.add("wrong"); }
      if (mine != null || p.revealed) b.disabled = true;
      b.onclick = function () { vote(p, i, msg); };
      opts.appendChild(b);
    });
    wrap.appendChild(opts);
    if (p.revealed && p.answer != null && mine != null) { msg.textContent = mine === p.answer ? "Esatto!" : "Non era questa: la risposta giusta è la " + L[p.answer] + "."; msg.className = "msg " + (mine === p.answer ? "ok" : "bad"); }
    else if (p.revealed) msg.textContent = "Votazione chiusa.";
    else if (mine != null) msg.textContent = "Voto inviato. Guarda i risultati sulla LIM.";
    else msg.textContent = "Tocca la tua risposta: si vota una volta sola.";
    wrap.appendChild(msg);
    box.appendChild(wrap);
  }
  function vote(p, i, msg) {
    [].forEach.call(box.querySelectorAll(".opt"), function (b) { b.disabled = true; });
    msg.textContent = "Invio…";
    sb.from("votes").insert({ class_id: c, round: p.round, voter: voter, choice: i }).then(function (r) {
      if (r.error && !/duplicate|unique/i.test(r.error.message)) { msg.textContent = "Voto non inviato: " + r.error.message; [].forEach.call(box.querySelectorAll(".opt"), function (b) { b.disabled = false; }); return; }
      mine = i; try { localStorage.setItem("novaula-voto-" + p.round, String(i)); } catch (e) {}
      shown = null; render(p);
    });
  }
  function fetchPoll() { sb.from("live_polls").select("*").eq("class_id", c).maybeSingle().then(function (r) { if (!r.error) render(r.data); }); }
  fetchPoll();
  sb.channel("vota-" + c).on("postgres_changes", { event: "*", schema: "public", table: "live_polls", filter: "class_id=eq." + c }, function (pl) { if (pl.new && pl.new.round) render(pl.new); }).subscribe();
  setInterval(fetchPoll, 4000);
})();
</script>
</body>
</html>
